name: Build $Deck

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      variant:
        description: "Which APK to build"
        type: choice
        options: [debug, release]
        default: debug

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  # The project has no Gradle wrapper committed, so CI pins the Gradle version itself.
  # AGP 8.5.2 needs Gradle 8.7 or newer.
  GRADLE_VERSION: "9.6.0"

jobs:
  engine:
    name: Engine (compile + checks)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}

      # Compiles the audio engine and UI Kotlin sources
      # (Engine, Dsp, Voice, AudioOut, Decoder, Analysis, Analyzer, Screens, MainActivity).
      - name: Compile Kotlin
        run: gradle :app:compileDebugKotlin --stacktrace

      - name: Unit tests
        run: gradle :app:testDebugUnitTest --stacktrace

      - name: Lint
        run: gradle :app:lintDebug --stacktrace

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.html
          if-no-files-found: ignore

  app:
    name: App (APK)
    needs: engine
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}

      - name: Build APK
        run: |
          if [ "${{ github.event.inputs.variant }}" = "release" ]; then
            gradle :app:assembleRelease --stacktrace
          else
            gradle :app:assembleDebug --stacktrace
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: deck-apk-${{ github.event.inputs.variant || 'debug' }}
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 30
